[package]
name = "game"
version = "0.1.0"
edition = "2024"
default-run = "game"

[dependencies]

bevy = { version = "0.17", features = ["dynamic_linking", "bevy_dev_tools", "track_location"] }
leafwing-input-manager = "0.19"
regex = "1.11.2"
avian3d = "0.4"
tokio = { version = "1.47.1", features = ["full"] }
bevy_mesh = "0.17.3"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
incremental = false

